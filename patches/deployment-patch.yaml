apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
  namespace: argocd-image-updater-system
spec:
  template:
    spec:
      containers:
        - name: argocd-image-updater-controller
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-ecr-credentials
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-ecr-credentials
                  key: aws_secret_access_key
            - name: AWS_REGION
              value: us-east-1
          volumeMounts:
            - name: ecr-login-script
              mountPath: /scripts
      volumes:
        - name: ecr-login-script
          configMap:
            name: ecr-login-script
            defaultMode: 0755
